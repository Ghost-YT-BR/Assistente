<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Origem Assist{% endblock %}</title>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
 
<body class="bg-light">
 
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            🚨 Origem Assist
        </span>
    </div>

<!-- Exemplo de como deves colocar na tua navbar no base.html -->
<ul class="navbar-nav ms-auto">
    {% if user.is_authenticated %}
        <li class="nav-item">
            <span class="nav-link text-dark fw-bold">👤 {{ user.username }}</span>
        </li>
        <li class="nav-item">
            <!-- Formulário obrigatório para o Logout no Django 5+ -->
            <form method="POST" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger ms-2">Sair</button>
            </form>
        </li>
    {% endif %}
</ul>
</nav>
 
<div class="container mt-5">
 
    {% block content %}
 
    {% endblock %}
 
</div>
 
</body>
</html>
